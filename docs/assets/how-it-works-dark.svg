<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-labelledby="title desc"><title id="title">omarchy-dotfiles structure and setup integrations</title><desc id="desc">The setup command exposes independent components. Orca Matrix and desktop preferences live in this repository. Matrix uses an external theme. Quickshell delegates to the separate lemun/quickshell-dots repository. Desktop touchpad preferences are optional. Documentation and inspected revisions are stored alongside the components.</desc><rect x="0" y="0" width="1600" height="800" rx="24" fill="#0E131B"/><text x="64" y="69" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#7CE790">PERSONAL OMARCHY SETUP</text><text x="64" y="130" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700" fill="#F8FAFC">One entry point. Independent components.</text><text x="64" y="176" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#B5C0CF">Repository structure and the integrations exposed by ./setup</text><rect x="64" y="284" width="312" height="322" rx="16" fill="#141D28" stroke="#354253" stroke-width="2"/><g transform="translate(88 310) scale(0.5)"><rect x="2" y="2" width="124" height="124" rx="28" fill="#141923" stroke="#687386" stroke-width="2"/><path d="M30 39H98" fill="none" stroke="#7CE790" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M34 59L53 77L34 95" fill="none" stroke="#F8FAFC" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M67 95H96" fill="none" stroke="#25F35D" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></g><text x="171" y="355" font-family="Courier New, monospace" font-size="36" font-weight="700" fill="#F8FAFC">./setup</text><text x="88" y="410" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#F8FAFC">Choose a component</text><text x="88" y="447" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#B5C0CF">and run it separately.</text><path d="M88 475H352" fill="none" stroke="#354253" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="88" y="517" font-family="Courier New, monospace" font-size="25" font-weight="700" fill="#7CE790">./setup status</text><text x="88" y="556" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#B5C0CF">Read-only status checks</text><path d="M376 445H432M432 270V654" fill="none" stroke="#354253" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M432 270H477m-11 -7 11 7-11 7" fill="none" stroke="#7CE790" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="494" y="214" width="1042" height="112" rx="14" fill="#141D28" stroke="#354253" stroke-width="2"/><rect x="494" y="231" width="5" height="78" rx="2" fill="#7CE790"/><text x="520" y="254" font-family="Courier New, monospace" font-size="27" font-weight="700" fill="#7CE790">./setup orca</text><text x="842" y="254" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#F8FAFC">Orca Matrix palette</text><text x="520" y="298" font-family="Courier New, monospace" font-size="22" font-weight="400" fill="#B5C0CF">components/orca-matrix/</text><text x="847.83" y="298" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#B5C0CF">→ Palette patch + Pacman hook</text><path d="M432 398H477m-11 -7 11 7-11 7" fill="none" stroke="#7CE790" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="494" y="342" width="1042" height="112" rx="14" fill="#141D28" stroke="#354253" stroke-width="2"/><rect x="494" y="359" width="5" height="78" rx="2" fill="#7CE790"/><text x="520" y="382" font-family="Courier New, monospace" font-size="27" font-weight="700" fill="#7CE790">./setup desktop</text><text x="842" y="382" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#F8FAFC">Desktop preferences</text><text x="520" y="426" font-family="Courier New, monospace" font-size="22" font-weight="400" fill="#B5C0CF">components/desktop/</text><text x="794.99" y="426" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#B5C0CF">→ Appearance, keyboard + optional touchpad</text><path d="M432 526H477m-11 -7 11 7-11 7" fill="none" stroke="#7CE790" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="494" y="470" width="1042" height="112" rx="14" fill="#141D28" stroke="#354253" stroke-width="2"/><rect x="494" y="487" width="5" height="78" rx="2" fill="#7CE790"/><text x="520" y="510" font-family="Courier New, monospace" font-size="27" font-weight="700" fill="#7CE790">./setup matrix</text><text x="842" y="510" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#F8FAFC">Matrix desktop theme</text><text x="520" y="554" font-family="Courier New, monospace" font-size="22" font-weight="400" fill="#B5C0CF">External theme</text><text x="728.94" y="554" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#B5C0CF">→ Desktop colors + wallpaper</text><path d="M432 654H477m-11 -7 11 7-11 7" fill="none" stroke="#7CE790" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="494" y="598" width="1042" height="112" rx="14" fill="#141D28" stroke="#354253" stroke-width="2"/><rect x="494" y="615" width="5" height="78" rx="2" fill="#7CE790"/><text x="520" y="638" font-family="Courier New, monospace" font-size="27" font-weight="700" fill="#7CE790">./setup quickshell</text><text x="842" y="638" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#F8FAFC">Quickshell bar</text><text x="520" y="682" font-family="Courier New, monospace" font-size="22" font-weight="400" fill="#B5C0CF">lemun/quickshell-dots</text><text x="821.4100000000001" y="682" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#B5C0CF">→ Standalone installer + saved shai profile</text><path d="M64 739H1536" fill="none" stroke="#354253" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="64" y="778" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#B5C0CF">docs/ — setup, maintenance and recovery     •     components/versions.json — inspected sources and revisions</text></svg>